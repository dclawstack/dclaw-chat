services:
  - type: web
    name: dclaw-chat-backend
    env: python
    plan: starter
    buildCommand: "pip install -e ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: dclaw-chat-db
          property: connectionString
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LOGTO_ENDPOINT
        sync: false
      - key: CORS_ORIGINS
        value: "https://dclaw-chat.vercel.app,https://chat.dclawstack.io"

databases:
  - name: dclaw-chat-db
    plan: starter
    databaseName: dclaw_chat
    user: dclaw_chat

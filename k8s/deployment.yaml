apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-chat
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-chat
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-chat
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/library/dclaw-chat:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

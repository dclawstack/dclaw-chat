# Default values for dclaw-chat

replicaCount: 2

frontend:
  image:
    repository: ghcr.io/dclawstack/dclaw-chat
    # T3-14: never deploy mutable `latest`. Pin a release tag, and in prod set
    # `digest` (e.g. "sha256:...") which takes precedence over `tag`.
    tag: v1.0.0
    digest: ""
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  image:
    repository: ghcr.io/dclawstack/dclaw-chat-backend
    # T3-14: pin a release tag; set `digest` in prod to deploy by content hash.
    tag: v1.0.0
    digest: ""
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    # T3-05: the fail-closed guard only fires under ENVIRONMENT=production —
    # without it an operator setting DEBUG=true boots the unauthenticated
    # Owner dev-user backdoor instead of being refused at startup.
    - name: ENVIRONMENT
      value: production
    # T3-11: no hardcoded postgres:postgres credentials — source the full DSN
    # (with its password) from the secret. Create the key with e.g.
    #   kubectl create secret generic dclaw-chat-secrets \
    #     --from-literal=database-url='postgresql+asyncpg://dclaw:<STRONG_PASS>@dclaw-chat-db-rw:5432/dclaw_chat'
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: dclaw-chat-secrets
          key: database-url
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: dclaw-chat-secrets
          key: openrouter-api-key

database:
  enabled: true
  storage: 10Gi
  instances: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

ingress:
  enabled: true
  className: nginx
  host: chat.dclawstack.io
  tls:
    enabled: true
    secretName: dclaw-chat-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

service:
  type: ClusterIP

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

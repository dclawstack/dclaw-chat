apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-chat.fullname" . }}-frontend
  labels:
    {{- include "dclaw-chat.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "dclaw-chat.selectorLabels" . | nindent 4 }}
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dclaw-chat.fullname" . }}-backend
  labels:
    {{- include "dclaw-chat.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8000
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "dclaw-chat.selectorLabels" . | nindent 4 }}
    component: backend

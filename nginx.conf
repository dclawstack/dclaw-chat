server {
    listen 80;
    root /usr/share/nginx/html;

    # Security headers (T3-13). TLS is terminated by the ingress/reverse proxy
    # in front of this container; HSTS is still emitted so it propagates.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=(), camera=(self), microphone=(self)" always;

    # Root URL → landing page
    location = / {
        try_files /landing.html =404;
    }

    # All other routes: try exact file, then .html extension, then directory index
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # API → proxy to the in-cluster backend service. The browser calls relative
    # /api/v1/* (frontend built with NEXT_PUBLIC_API_URL=/api/v1), so requests stay
    # same-origin and nginx forwards them to the FastAPI backend (full URI preserved).
    location /api/ {
        proxy_pass http://dclaw-chat-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Root URL → landing page
    location = / {
        try_files /landing.html =404;
    }

    # All other routes: try exact file, then .html extension, then directory index
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

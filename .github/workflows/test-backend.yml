name: Test Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dclaw_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # #22: prove an empty database reaches the current schema via Alembic
      # alone, and that migrations have not drifted from the ORM models.
      - name: Migrate empty database to head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dclaw_migrate
        run: alembic upgrade head

      - name: Check for model/migration drift
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dclaw_migrate
        run: alembic check

      - name: Run pytest
        run: python -m pytest -q

      - name: Type check
        working-directory: ./backend
        run: pip install mypy && mypy app --ignore-missing-imports || true

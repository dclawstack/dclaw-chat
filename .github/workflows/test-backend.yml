name: Test Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Type check
        working-directory: ./backend
        run: pip install mypy && mypy app --ignore-missing-imports || true

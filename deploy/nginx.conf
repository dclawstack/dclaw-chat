# DClaw Chat — Nginx Reverse Proxy
# Place in /etc/nginx/sites-available/chat.dclawstack.io

# Shared security headers (applied in each TLS server below).
# NOTE: the CSP keeps 'unsafe-inline'/'unsafe-eval' because Next.js ships an
# inline theme bootstrap and hydration scripts; tighten to nonces once the app
# emits them. connect-src allows wss/ws for the chat/calls/huddles sockets.
map $host $dclaw_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# T3-10: redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    server_name chat.dclawstack.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.dclawstack.io;

    # TLS — managed by certbot/cert-manager; adjust paths for your host.
    ssl_certificate     /etc/letsencrypt/live/chat.dclawstack.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.dclawstack.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (T3-13)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $dclaw_csp always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=(), camera=(self), microphone=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # T3-08: /docs and /openapi.json are disabled in prod at the app layer and
    # are intentionally NOT proxied here.
}

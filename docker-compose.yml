version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: dclaw-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — no default (T3-11)}
      POSTGRES_DB: dclaw_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dclaw -d dclaw_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    # T3-14: avoid the mutable `latest` tag. Pin a version (override via
    # OLLAMA_IMAGE, ideally to a @sha256 digest in production).
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.6.8}
    container_name: dclaw-chat-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dclaw-chat-backend
    restart: unless-stopped
    environment:
      # T3-05: default to production so the fail-closed guard engages —
      # with ENVIRONMENT=production the API refuses to boot if DEBUG=true.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://dclaw:${DB_PASSWORD:?DB_PASSWORD must be set — no default (T3-11)}@db:5432/dclaw_chat
      OLLAMA_URL: http://ollama:11434
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_URL: https://openrouter.ai/api/v1
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:-}
      LOGTO_ISSUER: ${LOGTO_ISSUER:-}
      LOGTO_JWKS_URL: ${LOGTO_JWKS_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://chat.dclawstack.io}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Readiness = DB reachable too, so compose won't route to a half-up backend (#29)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://chat.dclawstack.io/api/v1}
    container_name: dclaw-chat-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  ollama_data:

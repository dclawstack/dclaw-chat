version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: dclaw-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dclawpass}
      POSTGRES_DB: dclaw_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dclaw -d dclaw_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: dclaw-chat-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dclaw-chat-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:${DB_PASSWORD:-dclawpass}@db:5432/dclaw_chat
      OLLAMA_URL: http://ollama:11434
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_URL: https://openrouter.ai/api/v1
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://chat.dclawstack.io}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://chat.dclawstack.io/api}
    container_name: dclaw-chat-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
